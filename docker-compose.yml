services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repoatlas
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - "127.0.0.1"
        - -U
        - postgres
        - -d
        - repoatlas
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: repoatlas-api:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/repoatlas
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  worker:
    image: repoatlas-api:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.main"]
    init: true
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/repoatlas
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres_data:
  redis_data: